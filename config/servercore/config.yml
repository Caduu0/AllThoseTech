# The main configuration file for ServerCore.
# Most of these settings can be reloaded without restarting using /servercore reload.

features:
  prevent-moving-into-unloaded-chunks: true
  autosave-interval-seconds: 1200
  xp-merge-fraction: 2
  xp-merge-radius: 8.0
  item-merge-radius: 6.0
  lobotomize-villagers:
    enabled: true
    tick-interval: 100

dynamic:
  enabled: true
  target-mspt: 35
  default-values:
    MOBCAP_PERCENTAGE: 100
    CHUNK_TICK_DISTANCE: 10

  dynamic-settings:
    - setting: 'CHUNK_TICK_DISTANCE'
      max: 10
      min: 6
      increment: 1
      interval: 15

    - setting: 'MOBCAP_PERCENTAGE'
      max: 100
      min: 50
      increment: 10
      interval: 15

    - setting: 'SIMULATION_DISTANCE'
      max: 10
      min: 6
      increment: 1
      interval: 15

    - setting: 'CHUNK_TICK_DISTANCE'
      max: 6
      min: 2
      increment: 1
      interval: 15

    - setting: 'MOBCAP_PERCENTAGE'
      max: 50
      min: 30
      increment: 10
      interval: 15

    - setting: 'SIMULATION_DISTANCE'
      max: 6
      min: 4
      increment: 1
      interval: 15

    - setting: 'VIEW_DISTANCE'
      max: 10
      min: 5
      increment: 1
      interval: 150

breeding-cap:
  enabled: true
  villagers:
    limit: 16
    range: 64
    unlimited-height: false
  animals:
    limit: 20
    range: 64
    unlimited-height: false

mob-spawning:
  zombie-reinforcements:
    enforce-mobcap: true
    additional-capacity: 16
  nether-portal-randomticks:
    enforce-mobcap: true
    additional-capacity: 16
  monster-spawners:
    enforce-mobcap: true
    additional-capacity: 16
  infested:
    enforce-mobcap: true
    additional-capacity: 16

  categories:
    - category: 'MONSTER'
      mobcap: 50
      spawn-interval: 2
      despawn-distance: 128

    - category: 'CREATURE'
      mobcap: 10
      spawn-interval: 400
      despawn-distance: 128

    - category: 'AMBIENT'
      mobcap: 3
      spawn-interval: 400
      despawn-distance: 128

    - category: 'AXOLOTLS'
      mobcap: 5
      spawn-interval: 1
      despawn-distance: 128

    - category: 'UNDERGROUND_WATER_CREATURE'
      mobcap: 5
      spawn-interval: 1
      despawn-distance: 128

    - category: 'WATER_CREATURE'
      mobcap: 5
      spawn-interval: 400
      despawn-distance: 128

    - category: 'WATER_AMBIENT'
      mobcap: 5
      spawn-interval: 400
      despawn-distance: 64

commands:
  status-enabled: true
  mobcaps-enabled: true
  colors:
    primary: 'dark_aqua'
    secondary: 'green'
    tertiary: 'aqua'

activation-range:
  enabled: true
  tick-new-entities: true
  use-vertical-range: true
  skip-non-immune: true
  villager-tick-panic: false
  villager-work-immunity-after: 60
  villager-work-immunity-for: 20
  excluded-entity-types:
    - 'minecraft:hopper_minecart'
    - 'minecraft:warden'
    - 'minecraft:ghast'

  default-activation-type:
    activation-range: 12
    tick-interval: 20
    wakeup-interval: -1
    extra-height-up: false
    extra-height-down: false

  custom-activation-types:
    - name: 'raider'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:raider'

    - name: 'water'
      activation-range: 16
      tick-interval: 40
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:water_animal'

    - name: 'villager'
      activation-range: 12
      tick-interval: 40
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:villager'

    - name: 'zombie'
      activation-range: 12
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:zombie'
        - 'minecraft:husk'

    - name: 'monster-below'
      activation-range: 24
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: true
      entity-matcher:
        - 'minecraft:creeper'
        - 'minecraft:slime'
        - 'minecraft:magma_cube'
        - 'minecraft:hoglin'

    - name: 'flying-monster'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:ghast'
        - 'minecraft:phantom'

    - name: 'monster'
      activation-range: 24
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:monster'

    - name: 'animal'
      activation-range: 12
      tick-interval: 40
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:animal'
        - 'typeof:ambient'

    - name: 'creature'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:mob'